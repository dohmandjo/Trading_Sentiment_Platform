name: 'dbt_models'
version: '1.0.0'
profile: 'dbt_models'          # see profiles.example.yml
require-dbt-version: [">=1.10.5", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_models:
    staging:
      +materialized: view
    marts:
      +materialized: table
