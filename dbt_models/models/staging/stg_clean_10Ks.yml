version: 2

models:
  - name: stg_clean_10Ks
    description: "10-K filings of the top companies with Business, Risk Factors and MD&A each longer than 5,000 characters."
    columns:
      - name: cik
        data_tests: [not_null]
      - name: filing_date
        data_tests: [not_null]
      - name: company_name
        data_tests: [not_null]
      - name: tickers
        data_tests: [not_null]
      - name: accessionNumber
        data_tests: [not_null]
      - name: market_cap
        data_tests: [not_null]
      - name: filing_url
        data_tests: [not_null]
      - name: bus_text
        data_tests:
          - not_null
          - min_length:
              arguments:
                min_value: 5000
      - name: risks_text
        data_tests:
          - not_null
          - min_length:
              arguments:
                min_value: 5000
      - name: mda_text
        data_tests:
          - not_null
          - min_length:
              arguments:
                min_value: 5000
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, filing_date]
