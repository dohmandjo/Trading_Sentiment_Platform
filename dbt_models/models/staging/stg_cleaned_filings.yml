version: 2

models:
  - name: stg_cleaned_filings
    description: "10-K filings with non-empty Risk Factors and MD&A text. One row per (cik, filing_date)."
    columns:
      - name: cik
        data_tests: [not_null]
      - name: company_name
        data_tests: [not_null]
      - name: tickers
        data_tests: [not_null]
      - name: filing_date
        data_tests: [not_null]
      - name: market_cap
        data_tests: [not_null]
      - name: accessionNumber
        data_tests: [not_null]
      - name: form_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['10-K']
      - name: risks_text
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "!= ''"
      - name: mda_text
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "!= ''"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, filing_date]
